[package]
name = "cw32-metapac"
version = "0.24.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["pac"]
# Metadata-only host consumers disable defaults and do not link Cortex-M code.
pac = ["dep:cortex-m"]
cw32l012c8 = []
cw32f030c8 = []
metadata = []
rt = ["dep:cortex-m-rt"]

[dependencies]
cortex-m = { version = "=0.7.7", optional = true }
cortex-m-rt = { version = "=0.7.5", optional = true, features = ["device"] }
