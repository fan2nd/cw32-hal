  write_behavior: mixed
  read_behavior: ordinary
  source: RM1.4 8.8.4; SDK DMA_StartTransfer
  description: 'SOFTSRC bit 1: write one immediately triggers transfer, write zero has no effect; reads report transfer
    activity. TYPE/HARDSRC are normal configuration. A read-modify-write could retrigger.'
- block: dma
  register: TRIG4
  write_behavior: mixed
  read_behavior: ordinary
  source: RM1.4 8.8.4; SDK DMA_StartTransfer
  description: 'SOFTSRC bit 1: write one immediately triggers transfer, write zero has no effect; reads report transfer
    activity. TYPE/HARDSRC are normal configuration. A read-modify-write could retrigger.'
- block: dmachannel
  register: TRIG
  write_behavior: mixed
  read_behavior: ordinary
  source: RM1.4 8.8.4; SDK DMA_StartTransfer
  description: Alias view of DMA.TRIG1..4. SOFTSRC write one triggers; zero does nothing; TYPE/HARDSRC are configuration.
    Must share ownership with parent DMA channel registers.
- block: halltim
  register: CR
  write_behavior: mixed
  read_behavior: ordinary
  source: RM1.4 18.8.1; SDK HALLTIM_GenerateSoftTrigger
  description: SOFTCAP bit 23 is R0W1 software capture/trigger action; remaining implemented fields are configuration.
- block: halltim
  register: CNT
  write_behavior: zero_to_clear
  read_behavior: ordinary
  source: RM1.4 18.8.3; SDK HALLTIM_GetCounterValue
  description: Manual classifies 24-bit DATA as RW0 although header/SVD say RW. Treat as readable counter with zero-clearing
    semantics; arbitrary counter preload writes are not established by the sources.
- block: i2c
