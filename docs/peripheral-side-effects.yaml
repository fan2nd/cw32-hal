  write_behavior: command
  read_behavior: ordinary
  source: RM1.4 19.3.4-5; 19.6.1; SDK __IWDT_UNLOCK/__IWDT_REFRESH/__IWDT_STOP
  description: 'Write-only keys: 0x5555 unlock; non-0x5555 locks. 0xCCCC starts, 0xAAAA reloads, 0x5A5A then 0xA5A5
    stops. These operating commands also lock the protected registers.'
- block: iwdt
