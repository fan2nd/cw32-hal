  write_behavior: mixed
  read_behavior: ordinary
  source: RM1.4 23.8.3 and 23.4.1.5; SDK I2C_MasterRxDataMatch
  description: RDMO has an unresolved access conflict. The table labels it R0W1, but its own prose and SDK require both enable and disable operations; CIRFIFO is normal configuration. Do not infer a safe generic RMW or a write-one-only action from the label alone.
