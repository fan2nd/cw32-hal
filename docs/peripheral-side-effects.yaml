- block: atim
  register: BDTR
  write_behavior: mixed
  read_behavior: ordinary
  source: RM1.4 17.10.25; SDK ATIM_Brake1Config/ATIM_Brake2Config
  description: LOCK is writable only once after reset and selects increasing write-protection levels for BDTR and
    other timer registers. MOE/other control fields have separate semantics, so the whole register is not simply
    write_once. A HAL must configure the protected set before locking and account for brake-driven MOE clearing.
- block: gpio
  register: BRR
  write_behavior: one_to_clear
  read_behavior: ordinary
  source: RM1.4 9.6.15; SDK GPIO_WritePin
  description: 'R0W1 output action: selected ones reset ODR output latches; zeros do nothing. This clears output
    bits, not interrupt flags.'
- block: gpio
  register: BSRR
  write_behavior: mixed
  read_behavior: ordinary
  source: RM1.4 9.6.16; SDK GPIO_WritePin
  description: 'R0W1 output action: low halfword sets ODR; high halfword resets ODR. Use one direct write, not RMW.'
- block: gpio
  register: TOG
  write_behavior: toggle
  read_behavior: ordinary
  source: RM1.4 9.6.17; SDK GPIO_TogglePin
  description: 'R0W1 output action: each written one toggles the corresponding ODR latch; zero does nothing.'
- block: adc
  register: START
  write_behavior: command
  read_behavior: ordinary
  source: RM1.4 25.4.1; 25.12.2; SDK ADC_SoftwareStartConvCmd
  description: Write one starts conversion; write zero stops conversion and resets the sequence channel. Completion
    clears START in the documented conversion mode. Do not treat it as an ordinary software-owned state bit.
- block: cordic
  register: X
  write_behavior: command
  read_behavior: clear
  source: RM1.4 12.3; 12.6.1; SDK CORDIC_StartComputation
  description: 'Operand writes can start computation, depending on FUNC: the sole used operand starts a one-input
    function, and Y starts two-input functions. Reading computation results clears CSR.EOC. Manual does not precisely
    define multi-result read ordering; do not invent it. CORDIC_StartComputation in SDK is empty and is not a start
    strobe.'
- block: cordic
  register: Y
