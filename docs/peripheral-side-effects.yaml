  write_behavior: command
  read_behavior: ordinary
  source: RM1.4 10.4.1; SDK CRC16_Calc_8bit
  description: Programming MODE initializes the CRC algorithm/initial value for a new calculation; do not assume
    rewriting the current MODE is harmless.
- block: crc
  register: DR
  write_behavior: command
  read_behavior: ordinary
  source: RM1.4 10.3.2; 10.6.2; SDK CRC16_Calc_8bit
  description: Each write feeds an 8-bit input into the running CRC calculation. A read-write access tag does not
    permit a meaningful modify operation.
- block: eau
  register: DIVIDEND
  write_behavior: command
  read_behavior: ordinary
  source: RM1.4 11.5; 11.7.2-3; SDK EAU_StartOperation
  description: In divide mode DIVISOR write starts computation after DIVIDEND; in square-root mode DIVIDEND write
    starts it and DIVISOR is unused. Writes while BUSY are ignored; only 32-bit register accesses are supported.
- block: eau
