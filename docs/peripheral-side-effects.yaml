  write_behavior: keyed
  read_behavior: ordinary
  source: RM1.4 19.3.4; 19.6.2-6; SDK IWDT_Init
  description: Requires prior KR=0x5555 unlock and corresponding update flag clear before access. Writes cross the
    watchdog clock domain; poll completion. WINR update also reloads the counter and window violations can reset
    the chip.
