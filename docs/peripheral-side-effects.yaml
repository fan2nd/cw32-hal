  write_behavior: mixed
  read_behavior: ordinary
  source: RM1.4 20.6.1; SDK WWDT_Init/WWDT_Feed
  description: EN bit 7 is RW1, cannot be disabled once enabled. WCNT reads the live counter; writes refresh it,
    and refresh outside the valid window can reset the system.
- block: wwdt
  register: CR1
  write_behavior: mixed
  read_behavior: ordinary
  source: RM1.4 20.6.2; SDK WWDT_Init
  description: IE bit 10 is labelled RW but manual explicitly says it cannot be cleared after setting. PRS/WINR
    are ordinary configuration; no unrestricted toggle-IE API.
- block: wwdt
