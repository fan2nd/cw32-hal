  write_behavior: zero_to_clear
  read_behavior: ordinary
  source: RM1.4 27.7.6; SDK VC_ClearInterruptFlag
  description: INTF bit 0 is RW0; FLTV bit 1 is RO. Zero acknowledges the interrupt; a level condition may immediately
    assert it again.
- block: lvd
  register: SR
  write_behavior: zero_to_clear
  read_behavior: ordinary
  source: RM1.4 28.7.3; SDK LVD_ClearIrq
  description: INTF bit 0 is RW0; FLTV bit 1 is RO. Zero acknowledges the interrupt; a level condition may immediately
