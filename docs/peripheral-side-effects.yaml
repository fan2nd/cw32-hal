# Manually reviewed semantic overlays, not a hardware-validation claim.
# Register-level classification is conservative; conditional/mixed field behavior is in description.
# Access corrections and unresolved source conflicts are in full-peripheral-semantics.md.
- block: adc
  register: ICR
  write_behavior: zero_to_clear
  read_behavior: ordinary
  source: RM1.4 25.12.10; RM1.4 1.2
  description: 'Implemented interrupt-clear fields are R1W0: read as one; write zero clears the corresponding ISR
    flag, write one has no effect. Write ones to unselected implemented clear bits. This is not an ordinary RW latch
    or W1C register; reserved-bit policy remains register-specific.'
