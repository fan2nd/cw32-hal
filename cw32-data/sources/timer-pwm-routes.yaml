schema_version: 1
scope: Audited GTIM1-4 main-output routes and L012 ATIM.CH4, imported into the chip pin-route sources. Physical routing evidence
  does not establish board electrical safety.
sources:
  f030_rm:
    url: https://www.whxy.com/uploads/files/20240920/CW32x030_UserManual_CN_V2.5.pdf
    version: '2.5'
    sha256: 1afd49261f0f0689af8cb8ebf1b0ac1c00e3209b20d3c722106707ff4a10bdd2
  f030_ds:
    url: https://www.whxy.com/uploads/files/20251229/CW32F030_DataSheet_CN_V1.9.pdf
    version: '1.9'
    sha256: 04ef91434320e5d05a3b6690fead0fedb31a7d9bad28c96b655a6e13a22e46b2
  l012_rm:
    url: https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf
    version: '1.4'
    sha256: a9e54694a26f03c1f3e3041f40844900168ca2b8e6142f3328671b92e6b7a340
  l012_gpio:
    sdk_url: https://www.whxy.com/uploads/files/20260701/CW32L012_StandardPeripheralLib_V1.0.5.zip
    sdk_version: 1.0.5
    path: vendor/cw32l012_gpio.h
    upstream_path: Libraries/inc/cw32l012_gpio.h
    sha256: 45f356e8028475c2e25d135c5fdd0b75babb6b1c83f1d5534038e9355822d717
constraint_sets:
  common_gpio:
    direction: Set GPIOx_ANALOG.PINy=0 and GPIOx_DIR.PINy=0, then the stated AFRL/AFRH value; GPIO clock must be enabled.
      Select suitable push-pull/open-drain and board electrical parameters. Existing pin ownership rules remain.
    sources:
    - f030_rm sections 9.4.1/9.4.4 p150 (GPIO lock must also be unlocked)
    - l012_rm sections 9.4.1/9.4.4 p131
  f030_gtim:
    output_proof: RM2.5 section14.3.4.1 Table14-6 p229 explicitly covers GTIMx_CHy for x,y=1..4 as output compare/PWM channels.
      CCyM=0xE gives high when CNT>=CCR; CCyM=0xF gives high when CNT<CCR. These are CHy main signals, not the distinct TOGP/TOGN
      signals.
    gpio: common_gpio
    sysctrl_output_remap: null
    remap_reason: SYSCTRL_GTIMxCAP is capture input source only (sections4.7.20-23 pp89-90 and 14.3.3.2/Table14-5 p228); it
      is not an output remap and must not be written merely to select PWM output. Output uses the stated AF plus digital-output
      mode.
    channel_gate: 'Do not infer L012 CCER-style channel enable semantics: F030 mode selection is CMMR.CCyM.'
  l012_gtim:
    output_proof: RM1.4 section16.3.4/Table16-9 p262 and section16.3.4.3/Table16-10 p264 explicitly support CHy PWM outputs;
      section16.8.8 p282 is an external output example.
    gpio: common_gpio
    selection: Set CCMR1CMP/CCMR2CMP.CCyS=0 while CCER.CCyE=0; choose OCyM=6/7, then CCER.CCyE=1 and desired CCyP. CCyNP must
      remain 0 in output mode (section16.10.12 pp302-303). Timer clocks/timebase/start remain separate driver operations.
    sysctrl_output_remap: null
    remap_reason: GTIMx_TISEL.TIySEL selects capture input sources (section16.3.3.2/Table16-8 p261). It is not a PWM output
      route selector. No SYSCTRL remap step is in the external-output programming example.
  l012_atim_ch4:
    output_proof: RM1.4 section17.3.1.10 p327 explicitly supports independent CH1..CH6 outputs; section17.3.4 p341 and Table9-2
      pp128-129 establish external CH4.
    gpio: common_gpio
    selection: Set CCMR2CMP.CC4S=0 while CCER.CC4E=0; choose OC4M including OC4MH consistently, enable CCER.CC4E, and configure
      desired CC4P. ATIM output additionally depends on BDTR.MOE, break state, OSSI/OSSR, OIS4/OIS4N and CC4NE. This route
      does not establish safe break/dead-time configuration.
    sysctrl_output_remap: null
    remap_reason: ATIM_TISELx selects input-capture sources only; the stated AF plus output direction selects the external
      CH4 output.
    sources:
    - section17.10.11 p391 (CC4S/OC4M)
    - section17.10.14 pp394-395 (CC4E and output gating)
    - BDTR.MOE p402
