exceptions:
- chip: cw32f030c8
  signal: ATIM.CH4
  status: no_external_pin_by_explicit_manual_definition
  evidence: RM2.5 section15.3.1.6 p264 explicitly states CH4 is internal-only, no external pin; compare-only, not capture.
    This is not inferred from missing metadata.
- chip: cw32l012c8
  signals:
  - ATIM.CH4N
  - ATIM.CH5
  - ATIM.CH5N
  - ATIM.CH6
  - ATIM.CH6N
  status: outside_requested_main_CH1_to_CH4_route_scope
  evidence: CH4N is explicitly PA2 AF7 and PB8 AF5 in RM1.4 Table9-2 and SDK macros; not inserted in main-output route list.
    CH5/6 likewise exist but were outside bounded audit.
- chips:
  - cw32f030c8
  - cw32l012c8
  signals:
  - GTIMx.ETR
  - GTIMx.TRGO
  - GTIMx.TOGP
  - GTIMx.TOGN
  status: outside_main_CHy_PWM_route_scope
  evidence: Not substituted for CHy outputs; input trigger, trigger output and toggle-output signals remain distinct.
- chip: cw32l012c8
  topic: AF8/AF9
  status: confirmed
  evidence: RM1.4 Table9-1 prints only AF0..7, but Table9-2 explicitly includes AF8/AF9 and every proposed AF8/9 route is
    independently matched to an SDK macro writing 8/9 into the four-bit AFR field.
