# Audited CW32L012 subset. See sources/provenance.yaml for evidence and limits.
schema_version: 1
scope: Complete CW32L012 register-model coverage with explicit source discrepancies, all 32 external IRQs, chip memory and separately audited package maps. Experimental; not hardware validated.
