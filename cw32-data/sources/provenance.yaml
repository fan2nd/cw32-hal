# Source evidence for the maintained CW32L012C8 and CW32F030C8 datasets.
schema_version: 1
scope: Both existing CW32L012C8 and CW32F030C8 chip datasets, comprising 87 peripheral views and 46 reusable IP definitions. Register layouts, complete external IRQ tables, memory, maintained die pins and selected signal routes retain explicit source discrepancies. Experimental; not hardware validated.
