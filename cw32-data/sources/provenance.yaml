evidence:
- applies_to: registers/*/l012.yaml registers; families/cw32l012.yaml peripheral addresses
  sources:
  - cmsis-header
  - mdk-svd
  detail: Offsets/access and bases compared to the pinned CMSIS header and SVD; derived GPIOB/C/F
    register blocks resolve to GPIOA.
- applies_to: registers/sysctrl/l012.yaml bit masks and positions
  sources:
  - cmsis-header
  - mdk-svd
  detail: Mask and shift values match the CMSIS *_Msk and *_Pos definitions and SVD bitfields. HSI_DIV24
    additionally uses the SDK/manual encoding 14, shifted by 11.
- applies_to: families/cw32l012.yaml interrupts
  sources:
  - cmsis-header
  - mdk-svd
  detail: All 32 external IRQs come from CMSIS IRQn_Type. Pinned SVD contains the same 31 distinct
    IRQs for 0..30 but omits CLKFAULT (31); header authority retains it.
- applies_to: families/cw32l012.yaml constants and GPIO masks
  sources:
  - sdk
  - reference-manual
  detail: SYSCTRL key, factory trim addresses, reset polarity, implemented pin masks and PF03-only
    pull-down were retained from the existing manual audit. SDK gpio.h pin-function macros plus RM
    DIR reset masks establish logical pins, not package bonding.
- applies_to: chips/cw32l012c8.yaml memory
  sources:
  - sdk
  - reference-manual
  detail: 'RM table 2-1 agrees with SDK Template MDK project and CW32L012x8.icf: main Flash at 0x00000000,
    65536 bytes; SRAM at 0x20000000, 8192 bytes.'
- applies_to: chips/cw32l012c8.yaml pins
  sources:
  - datasheet
  detail: L012 Figures 5-1 and 5-2 on printed page 32 (PDF page 36) establish the evidence for the maintained 40 die GPIO identities. Chip YAML has no package-selection layer; board bonding remains a board responsibility. Original FOC route evidence is extended by sources/timer-pwm-routes.yaml, for 126 maintained L012 routes.
- applies_to: registers/*/l012.yaml reset_value/reset_source/reset_note; families/cw32l012.yaml register_resets
  sources:
  - reference-manual
  detail: 'RM1.4 full register reset headings, cross-checked against bit semantics, protection state and reset-domain notes. Full words include reserved bits (ADC.CR=0x100); unknowns and conflicting L012 GPIOA/B ANALOG/ICR remain explicit. See docs/register-reset-defaults.md. F030 entries cite their independently pinned RM2.5 evidence directly; shared watchdog values agree.'
- applies_to: families/cw32l012.yaml comparator
  sources:
  - reference-manual
  detail: 'RM1.4 sections 27.7.1-2 (printed p627) and 27.7.3 VCx_CR0.INN (printed p628): VC1/VC2 use VC12REF, VC3/VC4 use VC34REF; VC1/VC3 use DAC output 1, VC2/VC4 use DAC output 2. These are instance connections, not properties of the shared vc/l012 register block.'
- applies_to: registers/*/f030.yaml; families/cw32f030.yaml; chips/cw32f030c8.yaml
  sources:
  - f030-cmsis-header
  - f030-svd
  - f030-reference-manual
  - f030-datasheet
  detail: 'The 37 F030 peripheral views use 18 independently modeled F030 IP definitions plus the two structurally compatible watchdog models. All register and field positions/access and all 32 physical IRQ numbers are compared with the pinned artifacts. GPIOC/F are explicitly smaller implemented-pin subsets of the raw shared GPIO layout; conservative manual-backed access corrections remain. Maintained chip routes total 107 after the GTIM extensions; PF3/BOOT remains excluded from safe pin identities.'
cautions:
- pins:
  - PA13
  - PA14
  reason: SWD by default; GPIO unavailable while SYSCTRL.CR2.SWDIO=0. The HAL must not silently disable
    SWD.
- pins:
  - PF3
  reason: BOOT selection pin and the only internal pull-down-capable GPIO; boot circuitry must be
    considered.
limitations:
- The chip-level model is package-independent. Its maintained GPIO identities have datasheet evidence, but users must verify their physical package and PCB bonding. Only the 126 L012 and 107 F030 listed routes are modeled; other alternate functions remain unmodeled.
- No claimed UART/SPI/I2C/ADC/DMA/timer driver implementation follows from the IRQ metadata.
- Hardware timing, oscillator accuracy and physical GPIO operation have not been tested.
- RM1.4 HSI reset-value line 0x0001F772 conflicts with its reserved-upper-bits and TRIM-default text;
  use defined field semantics and factory trim, not a whole-register reset assumption.
- RM1.4 table 2-1 lists boot-ROM end 0x001009FF while labeling it 2KB; this conflicted region is deliberately
  omitted from executable linker memory.
- Device SVDs may differ between IDE packages; implementation was verified against current Libraries/inc/cw32l012.h
  and RM1.4.
- FOC pin routes include verified ATIM AF values and ADC/OPA/VC/DAC analog functions. Non-FOC pin multiplexing remains unmodeled.
- Access tags follow the vendor header/SVD. A read-write tag on ICR, BRR, BSRR or TOG does not make
  read-modify-write safe for these action registers.
- Pinned CMSIS header/SVD files remain available for offline audit. Reference-manual, SDK source-function
  semantics, memory-map and datasheet pin claims are attributed manual audits, not independent
  hardware verification.
l012_register_audit:
  instances: 50
  ip_models: 28
  logical_register_views: 306
  fields: 1713
  layout_evidence: docs/full-register-coverage.md
  semantics_evidence: docs/full-peripheral-semantics.md
  clock_irq_evidence: docs/peripheral-instances.md
  status: Complete modeled register layout with explicit source discrepancies; no hardware validation.
  raw_svd_fields_rejected: 15
  corrections:
  - ATIM header IER renamed DIER using RM and SVD/macro names.
  - ADC ISR word/fields use RO per RM25.12.9 despite header/SVD word RW and erroneous AWDH child; DAC DOR1/2 DATA child fields use RO.
  - DMA and DMACHANNEL CCNT registers and fields use conservative RO from RM 8.8.8 despite header/SVD RW.
  - GPIO PDR retains only PIN3; 15 fictitious SVD fields are rejected.
  - VCREF headerStructName and macro-prefix defects normalized without changing bit layout.
  - Timer CCMR capture/compare and I2C MCR2/SCR2 overlapping views use explicit alias_of.
  unresolved_source_conflicts:
  - VCREF DIV width is 3 bits in header/SVD and SDK encodings, 4 bits in RM prose; retain narrower evidenced model.
  - I2C RXWATER/RXCNT width is 2 bits in header/SVD, 12 bits in manual tables; retain narrower evidenced model.
  - GTIM ISR manual RW conflicts with header/SVD RO and separate ICR; retain read-only API.
current_dataset_audit:
  peripheral_views: 87
  ip_definitions: 46
  expanded_register_views: 520
  distinct_reset_evidence_records: 463
  known_reset_evidence_records: 442
  unknown_generic_reset_records: 21
  expanded_known_reset_views: 499
  instance_reset_overrides: 28
  reset_count_note: DMA parent channel arrays add 32 L012 and 25 F030 views of the already-audited DMACHANNEL records. They do not introduce 57 independent reset claims.
  clock_reset_references: 158
  physical_irqs_per_chip: 32
  limitations: Heading comparisons establish the declared full reset words; variable, reset-domain-dependent, instance-dependent and contradicted values remain unknown. Header/SVD consistency and primary-manual review do not establish silicon behavior.
