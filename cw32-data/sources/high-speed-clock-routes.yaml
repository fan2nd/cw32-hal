schema_version: 1
scope: Physical OSC_IN/OSC_OUT pads for validated startup HSE. These are distinct from the digital HSE_OUT clock-monitor AF signal.
routes:
  - { chip: CW32L012C8, controller: SYSCTRL, input: PF0, output: PF1 }
  - { chip: CW32F030C8, controller: SYSCTRL, input: PF0, output: PF1 }
sources:
  l012_rm:
    url: https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf
    version: '1.4'
    sha256: a9e54694a26f03c1f3e3041f40844900168ca2b8e6142f3328671b92e6b7a340
    sections: [4.3.3, 4.7.6]
  l012_datasheet:
    url: https://en.whxy.com/uploads/files/20260115/CW32L012_DataSheet_EN_V1.0.pdf
    version: '1.0'
    evidence: Table 5-2, printed p34, lists PF00 OSC_IN and PF01 OSC_OUT. PC13 has no oscillator function.
  l012_sdk:
    url: https://www.whxy.com/uploads/files/20260701/CW32L012_StandardPeripheralLib_V1.0.5.zip
    version: 1.0.5
    sha256: 8b0a4c0ee865642d08f353aec98906c900a8b10f672120e649e6b1bf5e29c18f
    evidence: Libraries/inc/cw32l012_sysctrl.h HSE_PIN_PORT=CW_GPIOF, HSE_PIN_IN=GPIO_PIN_0, HSE_PIN_OUT=GPIO_PIN_1; Examples/RCC/rcc_hsi_hse/USER/src/main.c uses these macros.
  f030_rm:
    url: https://www.whxy.com/uploads/files/20240920/CW32x030_UserManual_CN_V2.5.pdf
    version: '2.5'
    sha256: 1afd49261f0f0689af8cb8ebf1b0ac1c00e3209b20d3c722106707ff4a10bdd2
    sections: [4.3.3, 4.5.4, 4.7.6]
    evidence: Section 4.5.4, printed p64, identifies PF0/PF1.
  f030_datasheet:
    url: https://www.whxy.com/uploads/files/20251229/CW32F030_DataSheet_CN_V1.9.pdf
    version: '1.9'
    sha256: 04ef91434320e5d05a3b6690fead0fedb31a7d9bad28c96b655a6e13a22e46b2
    evidence: Table 5-2 and package diagrams identify OSC_IN/OSC_OUT on PF0/PF1.
  f030_sdk:
    url: https://www.whxy.com/uploads/files/20241111/CW32F030_StandardPeripheralLib_V2.2.zip
    version: '2.2'
    sha256: 7c431df43d7075b817a51d818ea4c9aba55f83b7c9c77bf0065976758954b780
    evidence: Libraries/src/cw32f030_rcc.c RCC_HSE_Enable configures PF0/PF1.
conflicts:
  - source: l012_rm section 4.5.4, printed p41
    discrepancy: The example names PB07/PC13, contradicting the L012 datasheet physical pin table and chip-specific SDK macros.
    resolution: Use PF0/PF1, corroborated independently by the datasheet and SDK. Do not generate PB7/PC13 HSE routes.
  - source: l012_sdk Libraries/src/cw32l012_sysctrl.c
    discrepancy: The bypass branch hardcodes GPIOA despite HSE_PIN_PORT=CW_GPIOF in the same SDK.
    resolution: Generate both crystal and bypass pad access from the confirmed physical routes; do not copy the hardcoded branch.
constraints:
  - Crystal mode uses both analog pads and withholds both GPIO tokens for the boot lifetime.
  - Bypass mode uses a digital OSC_IN and permits OSC_OUT as general GPIO, as both RM section 4.3.3 documents.
  - HSE configuration happens before enable; an inherited active or stable oscillator is rejected before touching pads.
  - A failed hardware initialization returns no tokens and cannot be retried until reset; pure invalid-profile rejection precedes MMIO and remains retryable.
