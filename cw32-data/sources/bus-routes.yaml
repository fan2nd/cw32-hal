schema_version: 1
scope: Physical UART, SPI and I2C alternate-function routes imported into chip pin_routes. Pin data includes CTS/RTS/CS without implying that the HAL implements those modes.
sources:
  l012:
    url: https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf
    version: '1.4'
    sha256: a9e54694a26f03c1f3e3041f40844900168ca2b8e6142f3328671b92e6b7a340
    table: 9-2
    printed_pages: [128, 129]
    corroboration: All 133 routes independently match vendor/cw32l012_gpio.h PAxx_AFx/PBxx_AFx/PCxx_AFx/PFxx_AFx macros from SDK1.0.5.
  f030:
    url: https://www.whxy.com/uploads/files/20240920/CW32x030_UserManual_CN_V2.5.pdf
    version: '2.5'
    sha256: 1afd49261f0f0689af8cb8ebf1b0ac1c00e3209b20d3c722106707ff4a10bdd2
    table: 9-2
    printed_pages: [146, 147]
    corroboration: All 116 routes visually checked against rendered manual tables; 33 SPI routes additionally match table19-1 p363 and all 30 I2C pin identities match table20-1 p400.
normalization:
  TXD: TX
  RXD: RX
  NCS: CS
constraints:
  - AF numbers are literal GPIO AFRL/AFRH selections. No SYSCTRL output remap is needed for these routes.
  - Data describes silicon routing. Applications must verify package bonding and board wiring.
  - HAL generated bus pin traits exclude PA13/PA14 until an explicit SWD-release API exists.
  - Oscillator pads require their oscillator function to be disabled; supported HSI-only startup leaves HSE/LSE unavailable as active sources.
  - SCL/SDA require open-drain and suitable external pull-up resistors. UART/SPI pin directions follow the selected controller role.
counts:
  cw32l012c8: { UART1: 24, UART2: 24, UART3: 21, SPI1: 16, SPI2: 12, SPI3: 12, I2C1: 18, I2C2: 6 }
  cw32f030c8: { UART1: 17, UART2: 20, UART3: 16, SPI1: 16, SPI2: 17, I2C1: 14, I2C2: 16 }
