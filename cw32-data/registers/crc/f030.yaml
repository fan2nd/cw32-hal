  offset: 0
  access: rw
  description: 'CW32F030 CRC.CR; layout matched against SDK V2.2 CMSIS header and SVD. See CW32x030 User Manual Rev 2.5 for value encodings. Selecting the CRC algorithm initializes the calculation state; it is not an ordinary software-owned latch. Source: CW32x030 RM Rev 2.5 10.4; 10.6.1'
