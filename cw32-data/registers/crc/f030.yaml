  access: rw
  description: 'CW32F030 CRC.DR32; layout matched against SDK V2.2 CMSIS header and SVD. See CW32x030 User Manual Rev 2.5 for value encodings. Writing feeds one datum into the CRC engine. The actual bus access width selects 8, 16 or 32 input bits; aliases must retain their access width. Source: CW32x030 RM Rev 2.5 10.3; 10.6.2'
