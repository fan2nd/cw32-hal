  reset_source: CW32x030 RM Rev2.5 section 12.5.15, printed p195 (PDF p196); https://www.whxy.com/uploads/files/20240920/CW32x030_UserManual_CN_V2.5.pdf;
    RM Rev2.5 section12.3.3, printed p177 (PDF p178)
  reset_note: Full reset word includes unmodeled/reserved set bits 0x00000020; retain them, do not mask to modeled fields.
    Power-on/default value, not a guarantee after every system reset. RM12.3.3 requires checking whether RTC is already running
    and the reset cause before reinitializing; DATE/TIME can be retained on non-POR resets. The prose and Figure12-2 differ
    in their non-POR branching, so do not generalize the L012 all-register POR-only retention rule to F030.
  offset: 56
  access: rw
  description: 'CW32F030 RTC.ICR; layout matched against SDK V2.2 CMSIS header and SVD. See CW32x030 User Manual Rev 2.5 for
    value encodings. Implemented R1W0 fields read as one; writing zero clears the associated flag and writing one preserves
    it. Keep unselected implemented bits at one; reserved-bit policy remains register-specific. Source: CW32x030 RM Rev 2.5
    12.5.15; 1.2'
