  reset_source: CW32L012 RM1.4 section 9.6.3, printed p133 (PDF p159); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf
  reset_note: RM9.6.3 explicitly gives GPIOx_PDR=0x00000008 for x=A/B/C/F; only PF03 has a physical pull-down. Do not
    infer additional implemented pull-down fields or change the documented reset word from the pin capability.
  offset: 12
  access: rw
  description: Pull-down enable; only PF03 implements an internal pull-down.
