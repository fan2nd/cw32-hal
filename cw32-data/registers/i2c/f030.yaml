  access: rw
  description: 'CW32F030 I2C.CR; layout matched against SDK V2.2 CMSIS header and SVD. See CW32x030 User Manual Rev 2.5 for value encodings. STA requests START and must be cleared by software. STO requests STOP and self-clears. SI is zero-to-clear and clearing it advances the bus state machine. Preserve configuration and status intentionally. Source: CW32x030 RM Rev 2.5 20.7.3'
