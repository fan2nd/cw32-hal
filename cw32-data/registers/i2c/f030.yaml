  access: rw
  description: 'CW32F030 I2C.DR; layout matched against SDK V2.2 CMSIS header and SVD. See CW32x030 User Manual Rev 2.5
    for value encodings. Writes prepare the next transmit byte and reads obtain the received byte. SI clearing separately
    advances the transfer; this is not the L012 FIFO controller. Source: CW32x030 RM Rev 2.5 20.7.4'
  fields:
  - name: DR
    bit_offset: 0
    bit_size: 8
    access: rw
    kind: raw
