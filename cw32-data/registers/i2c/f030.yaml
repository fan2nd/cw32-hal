    kind: bool
    description: CW32F030 I2C.CR.STO; raw encoding.
  - name: SI
    bit_offset: 3
    bit_size: 1
    access: rw
    kind: bool
    description: CW32F030 I2C.CR.SI; raw encoding.
  - name: AA
    bit_offset: 2
    bit_size: 1
