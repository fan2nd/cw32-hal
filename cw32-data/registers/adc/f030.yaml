- name: RESULT0
  reset_value: 0x00000000
  reset_source: "CW32x030 RM Rev2.5 section 22.13.12, printed p468 (PDF p469); https://www.whxy.com/uploads/files/20240920/CW32x030_UserManual_CN_V2.5.pdf"
  offset: 32
  access: ro
  description: 'CW32F030 ADC.RESULT0; layout matched against SDK V2.2 CMSIS header and SVD. See CW32x030 User Manual Rev 2.5 for value encodings. Reading consumes the unread-result state used by overrun detection and DISCARD result retention. The latch classification records this state change; it does not mean the value is a FIFO or that reading clears EOC, EOS or OVW. Clear interrupt flags explicitly through ICR. Source: CW32x030 RM Rev 2.5 22.13.2; 22.13.10; 22.5.1'
  fields:
