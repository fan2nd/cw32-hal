- name: ICR
  reset_value: 0x00000041
  reset_source: "CW32L012 RM1.4 section 14.10.6, printed p208 (PDF p234); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf"
  offset: 24
  access: rw
  description: 'Register ICR; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics. Implemented interrupt-clear fields are R1W0: read as one; write zero clears the corresponding ISR flag, write one has no effect. Write ones to unselected implemented clear bits. This is not an ordinary RW latch or W1C register; reserved-bit policy remains register-specific. Source: RM1.4 14.10.6; RM1.4 1.2'
  fields:
  - name: TIF
    bit_offset: 6
    bit_size: 1
    access: rw
    kind: bool
    description: Field TIF; raw encoding retained unless explicitly audited.
  - name: UIF
    bit_offset: 0
    bit_size: 1
    access: rw
    kind: bool
    description: Field UIF; raw encoding retained unless explicitly audited.
  write_behavior: zero_to_clear
  read_behavior: ordinary
- name: EGR
