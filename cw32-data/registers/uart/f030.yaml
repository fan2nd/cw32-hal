  reset_source: CW32x030 RM Rev2.5 section 18.9.9, printed p360 (PDF p361); https://www.whxy.com/uploads/files/20240920/CW32x030_UserManual_CN_V2.5.pdf
  reset_note: Full reset word includes unmodeled/reserved set bits 0x000000A1; retain them, do not mask to modeled fields.
  offset: 32
  access: rw
  description: 'CW32F030 UART.ICR; layout matched against SDK V2.2 CMSIS header and SVD. See CW32x030 User Manual Rev
    2.5 for value encodings. Implemented R1W0 fields read as one; writing zero clears the associated flag and writing
    one preserves it. Keep unselected implemented bits at one; reserved-bit policy remains register-specific. Source:
    CW32x030 RM Rev 2.5 18.9.9; 1.2'
