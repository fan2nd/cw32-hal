  reset_note: Full reset word includes unmodeled/reserved set bits 0x0000FFF8; retain them, do not mask to modeled fields.
  offset: 28
  access: rw
  description: 'Register ICR; layout independently matched to pinned CMSIS header and SVD; consult reference manual for
    value semantics. Implemented interrupt-clear fields are R1W0: read as one; write zero clears the corresponding ISR
