  offset: 8
  access: rw
  description: 'Register CNT; layout independently matched to pinned CMSIS header and SVD; consult reference manual for
    value semantics. Manual classifies 24-bit DATA as RW0 although header/SVD say RW. Treat as readable counter with
    zero-clearing semantics; arbitrary counter preload writes are not established by the sources. Source: RM1.4 18.8.3;
    SDK HALLTIM_GetCounterValue'
