    - name: GTIM1_CH2
      value: 28
    - name: GTIM1_CH3
      value: 29
    - name: GTIM1_CH4
      value: 30
    - name: GTIM2_TRIGGER
      value: 31
    - name: GTIM2_UPDATE
      value: 32
    - name: GTIM2_CH1
      value: 33
    - name: GTIM2_CH2
      value: 34
    - name: GTIM2_CH3
      value: 35
    - name: GTIM2_CH4
      value: 36
