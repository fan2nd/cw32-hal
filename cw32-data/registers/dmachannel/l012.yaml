  reset_source: CW32L012 RM1.4 section 8.8.4, printed p121 (PDF p147); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf
  offset: 16
  access: rw
  description: 'Register TRIG; layout independently matched to pinned CMSIS header and SVD; consult reference manual
    for value semantics. Alias view of DMA.TRIG1..4. SOFTSRC write one triggers; zero does nothing; TYPE/HARDSRC are
    configuration. Must share ownership with parent DMA channel registers. Source: RM1.4 8.8.4; SDK DMA_StartTransfer'
  fields:
  - name: HARDSRC
    bit_offset: 2
    bit_size: 6
    access: rw
    kind: enum
    description: Six-bit controller-wide hardware request selector. Exact chip-specific routes are in the DMA instance
      metadata; not interchangeable between L012 and F030.
    values:
    - name: UART1_RX
      value: 0
    - name: UART1_TX
      value: 1
    - name: UART2_RX
      value: 2
    - name: UART2_TX
      value: 3
    - name: UART3_RX
      value: 4
    - name: UART3_TX
      value: 5
    - name: SPI1_RX
      value: 6
    - name: SPI1_TX
      value: 7
    - name: SPI2_RX
      value: 8
    - name: SPI2_TX
      value: 9
    - name: SPI3_RX
      value: 10
    - name: SPI3_TX
      value: 11
    - name: ADC1_SEQUENCE
      value: 12
    - name: ADC1_SINGLE
      value: 13
    - name: ADC2_SEQUENCE
      value: 14
    - name: ADC2_SINGLE
      value: 15
    - name: DAC_DHR1_UNDERRUN
      value: 16
    - name: DAC_DHR2_UNDERRUN
      value: 17
    - name: HALLTIM_EVENT
