    - name: ATIM_CH1
      value: 50
    - name: ATIM_CH2
      value: 51
    - name: ATIM_CH3
      value: 52
    - name: ATIM_CH4
      value: 53
    - name: ATIM_CH5
      value: 54
    - name: ATIM_CH6
