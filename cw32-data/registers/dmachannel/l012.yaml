name: dmachannel
version: l012
registers:
- name: CSR
  reset_value: 0x00000000
  reset_source: "CW32L012 RM1.4 section 8.8.3, printed p119 (PDF p145); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf"
  offset: 0
  access: rw
  description: Register CSR; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics.
  fields:
  - name: DSTLOAD
    bit_offset: 15
    bit_size: 1
    access: rw
    kind: bool
    description: Field DSTLOAD; raw encoding retained unless explicitly audited.
  - name: SRCLOAD
    bit_offset: 14
    bit_size: 1
    access: rw
    kind: bool
    description: Field SRCLOAD; raw encoding retained unless explicitly audited.
  - name: TE
    bit_offset: 13
    bit_size: 1
    access: ro
    kind: bool
    description: Field TE; raw encoding retained unless explicitly audited.
  - name: TC
    bit_offset: 12
    bit_size: 1
    access: ro
    kind: bool
    description: Field TC; raw encoding retained unless explicitly audited.
  - name: RESTART
    bit_offset: 11
    bit_size: 1
    access: rw
    kind: bool
    description: Field RESTART; raw encoding retained unless explicitly audited.
  - name: STATUS
    bit_offset: 8
    bit_size: 3
    access: rw
    kind: raw
    description: "Terminal diagnostic: 0 initial, 1 address out of range, 2 transfer-stop request, 3 source access error, 4 destination access error, 5 complete. Not a BUSY flag; no documented drain guarantee. RM1.4 8.8.3 labels RW but gives no software-write semantics."
  - name: SIZE
    bit_offset: 6
    bit_size: 2
    access: rw
    kind: raw
    description: "0 selects 8-bit data and increment 1; 1 selects 16-bit data and increment 2; 2 selects 32-bit data and increment 4; 3 is not documented. RM1.4 8.8.3 specifies that transfer-width selection applies only to Flash/SRAM memory; address increment applies to all peripherals."
  - name: DSTINC
    bit_offset: 5
    bit_size: 1
    access: rw
    kind: bool
    description: Field DSTINC; raw encoding retained unless explicitly audited.
  - name: SRCINC
    bit_offset: 4
    bit_size: 1
    access: rw
    kind: bool
    description: Field SRCINC; raw encoding retained unless explicitly audited.
  - name: TRANS
    bit_offset: 3
    bit_size: 1
    access: rw
    kind: bool
    description: "0 selects BULK (no inter-block arbitration gaps), 1 selects BLOCK (arbitration after each block). Hardware BLOCK requires a request for each block; software BLOCK needs one start for the full count."
  - name: TEIE
    bit_offset: 2
    bit_size: 1
    access: rw
    kind: bool
    description: Field TEIE; raw encoding retained unless explicitly audited.
  - name: TCIE
    bit_offset: 1
    bit_size: 1
    access: rw
    kind: bool
    description: Field TCIE; raw encoding retained unless explicitly audited.
  - name: EN
    bit_offset: 0
    bit_size: 1
    access: rw
    kind: bool
    description: "0 disables, 1 enables the channel. The manual does not specify disable acknowledgement, automatic clearing, or completion of outstanding bus writes."
- name: CNT
  reset_value: 0x00000000
  reset_source: "CW32L012 RM1.4 section 8.8.5, printed p122 (PDF p148); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf"
  offset: 4
  access: rw
  description: Register CNT; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics.
  fields:
  - name: REPEAT
    bit_offset: 16
    bit_size: 4
    access: rw
    kind: raw
    description: "Data items per block, nonzero and at most 15; total items CNT times REPEAT. Paced source or destination requires REPEAT=1. RM1.4 8.5.2 recommends 1 and 8.8.5 defines block size."
  - name: CNT
    bit_offset: 0
    bit_size: 16
    access: rw
    kind: raw
    description: Field CNT; raw encoding retained unless explicitly audited.
- name: SRCADDR
  reset_value: 0x00000000
  reset_source: "CW32L012 RM1.4 section 8.8.6, printed p122 (PDF p148); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf"
  offset: 8
  access: rw
  description: Register SRCADDR; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics.
  fields:
  - name: SRCADDR
    bit_offset: 0
    bit_size: 32
    access: rw
    kind: raw
    description: Field SRCADDR; raw encoding retained unless explicitly audited.
- name: DSTADDR
  reset_value: 0x00000000
  reset_source: "CW32L012 RM1.4 section 8.8.7, printed p122 (PDF p148); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf"
  offset: 12
  access: rw
  description: Register DSTADDR; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics.
  fields:
  - name: DSTADDR
    bit_offset: 0
    bit_size: 32
    access: rw
    kind: raw
    description: Field DSTADDR; raw encoding retained unless explicitly audited.
- name: TRIG
  reset_value: 0x00000000
  reset_source: "CW32L012 RM1.4 section 8.8.4, printed p121 (PDF p147); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf"
  offset: 16
  access: rw
  description: 'Register TRIG; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics. Alias view of DMA.TRIG1..4. SOFTSRC write one triggers; zero does nothing; TYPE/HARDSRC are configuration. Must share ownership with parent DMA channel registers. Source: RM1.4 8.8.4; SDK DMA_StartTransfer'
  fields:
  - name: HARDSRC
    bit_offset: 2
    bit_size: 6
    access: rw
    kind: raw
    description: "Six-bit controller-wide hardware request selector. Exact chip-specific routes are in the DMA instance metadata; not interchangeable between L012 and F030."
  - name: SOFTSRC
    bit_offset: 1
    bit_size: 1
    access: rw
    kind: bool
    description: "Reads zero after transfer completion and one while transfer is in progress. Writing one software-triggers the channel; writing zero has no effect. Not documented as an abort or hardware-trigger drain acknowledgement."
  - name: TYPE
    bit_offset: 0
    bit_size: 1
    access: rw
    kind: bool
    description: "0 selects software triggering by SOFTSRC; 1 selects hardware triggering by the HARDSRC request source."
  write_behavior: mixed
  read_behavior: ordinary
- name: CCNT
  reset_value: 0x00000000
  reset_source: "CW32L012 RM1.4 section 8.8.8, printed p123 (PDF p149); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf"
  offset: 20
  access: ro
  description: Register CCNT; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics.
  fields:
  - name: CREPEAT
    bit_offset: 16
    bit_size: 4
    access: ro
    kind: raw
    description: Field CREPEAT; raw encoding retained unless explicitly audited.
  - name: CCNT
    bit_offset: 0
    bit_size: 16
    access: ro
    kind: raw
    description: Field CCNT; raw encoding retained unless explicitly audited.
- name: CSRCADDR
  reset_value: 0x00000000
  reset_source: "CW32L012 RM1.4 section 8.8.9, printed p123 (PDF p149); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf"
  offset: 24
  access: ro
  description: Register CSRCADDR; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics.
  fields:
  - name: CSRCADDR
