    values_source: CW32L012 RM1.4 sections 8.2, 8.7 and 8.8.4 (printed pp107,117,121), table 5-1; https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf
  - name: SOFTSRC
    bit_offset: 1
    bit_size: 1
    access: rw
    kind: bool
    description: Reads zero after transfer completion and one while transfer is in progress. Writing one software-triggers
      the channel; writing zero has no effect. Not documented as an abort or hardware-trigger drain acknowledgement.
  - name: TYPE
    bit_offset: 0
    bit_size: 1
    access: rw
    kind: enum
    description: 0 selects software triggering by SOFTSRC; 1 selects hardware triggering by the HARDSRC request source.
    values:
    - name: SOFTWARE
      value: 0
    - name: HARDWARE
      value: 1
    values_source: CW32L012 RM1.4 section 8.8.4, printed p121 (PDF p147); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf
