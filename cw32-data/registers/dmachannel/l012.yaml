    kind: raw
    description: Field CSRCADDR; raw encoding retained unless explicitly audited.
- name: CDSTADDR
  reset_value: 0x00000000
  reset_source: "CW32L012 RM1.4 section 8.8.10, printed p123 (PDF p149); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf"
  offset: 28
  access: ro
  description: Register CDSTADDR; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics.
  fields:
