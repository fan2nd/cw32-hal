  reset_source: "CW32x030 RM Rev2.5 section 19.8.6, printed p393 (PDF p394); https://www.whxy.com/uploads/files/20240920/CW32x030_UserManual_CN_V2.5.pdf"
  offset: 20
  access: rw
  description: 'CW32F030 SPI.ICR; layout matched against SDK V2.2 CMSIS header and SVD. See CW32x030 User Manual Rev 2.5 for value encodings. R1W0 interrupt clears plus FLUSH bit zero: writing zero to FLUSH clears the transmit buffer and shift register and sets TXE. Unselected bits must remain one to avoid an unintended flush. Source: CW32x030 RM Rev 2.5 19.8.6'
