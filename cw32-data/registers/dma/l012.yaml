blocks:
- name: CH
  offset: 32
  block: dmachannel
  version: l012
  array:
    len: 4
    stride: 32
  description: DMA channel register bank; index 0 selects hardware channel 1. Reuses the separately audited channel layout.
  source: CW32 reference manual and pinned CMSIS/SVD channel offsets; exact parent/child layout audit. CW32L012 RM1.4 section
    8.8.3, printed p119 (PDF p145); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf
