- name: ICR
  reset_value: 4294967295
  reset_source: CW32L012 RM1.4 section 8.8.2, printed p119 (PDF p145); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf
  reset_note: Full reset word includes unmodeled/reserved set bits 0xFFFFCCCC; retain them, do not mask to modeled fields.
  offset: 4
  access: rw
  description: 'Register ICR; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value
    semantics. Implemented interrupt-clear fields are R1W0: read as one; write zero clears the corresponding ISR flag, write
    one has no effect. Write ones to unselected implemented clear bits. This is not an ordinary RW latch or W1C register;
    reserved-bit policy remains register-specific. Source: RM1.4 8.8.2; RM1.4 1.2'
  fields:
  - name: TE4
    bit_offset: 13
    bit_size: 1
    access: rw
    kind: bool
    description: Field TE4; raw encoding retained unless explicitly audited.
  - name: TC4
    bit_offset: 12
    bit_size: 1
    access: rw
    kind: bool
    description: Field TC4; raw encoding retained unless explicitly audited.
  - name: TE3
