  description: 'Register X; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics. Operand writes can start computation, depending on FUNC: the sole used operand starts a one-input function, and Y starts two-input functions. Reading computation results clears CSR.EOC. Manual does not precisely define multi-result read ordering; do not invent it. CORDIC_StartComputation in SDK is empty and is not a start strobe. Source: RM1.4 12.3; 12.6.1; SDK CORDIC_StartComputation'
