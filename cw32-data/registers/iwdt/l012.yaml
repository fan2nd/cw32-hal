  offset: 12
  access: rw
  description: 'Register SR; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics. OV bit 3 is RW0; RUN/RELOAD/CRF/ARRF/WINRF are RO. Do not treat the status register as a normal RW value. Source: RM1.4 19.6.6; SDK IWDT_ClearOVFlag'
