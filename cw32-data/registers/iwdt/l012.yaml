name: iwdt
version: l012
registers:
- name: KR
  reset_value: 0x00000000
  reset_source: "CW32L012 RM1.4 section 19.6.1, printed p433 (PDF p459); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf"
  offset: 0
  access: wo
  description: 'Register KR; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics. Write-only keys: 0x5555 unlock; non-0x5555 locks. 0xCCCC starts, 0xAAAA reloads, 0x5A5A then 0xA5A5 stops. These operating commands also lock the protected registers. Source: RM1.4 19.3.4-5; 19.6.1; SDK __IWDT_UNLOCK/__IWDT_REFRESH/__IWDT_STOP'
  fields:
  - name: KR
    bit_offset: 0
    bit_size: 16
    access: wo
    kind: raw
    description: Field KR; raw encoding retained unless explicitly audited.
  write_behavior: command
  read_behavior: ordinary
- name: CR
  reset_value: 0x00000000
  reset_source: "CW32L012 RM1.4 section 19.6.2, printed p433 (PDF p459); https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf"
  offset: 4
  access: rw
  description: 'Register CR; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics. Requires prior KR=0x5555 unlock and corresponding update flag clear before access. Writes cross the watchdog clock domain; poll completion. WINR update also reloads the counter and window violations can reset the chip. Source: RM1.4 19.3.4; 19.6.2-6; SDK IWDT_Init'
  fields:
  - name: PAUSE
    bit_offset: 5
    bit_size: 1
    access: rw
    kind: bool
    description: Field PAUSE; raw encoding retained unless explicitly audited.
  - name: IE
    bit_offset: 4
    bit_size: 1
    access: rw
    kind: bool
    description: Field IE; raw encoding retained unless explicitly audited.
  - name: ACTION
    bit_offset: 3
    bit_size: 1
    access: rw
    kind: bool
    description: Field ACTION; raw encoding retained unless explicitly audited.
  - name: PRS
    bit_offset: 0
    bit_size: 3
    access: rw
    kind: raw
    description: Field PRS; raw encoding retained unless explicitly audited.
  write_behavior: keyed
  read_behavior: ordinary
- name: ARR
