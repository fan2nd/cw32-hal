  offset: 4
  access: rw
  description: 'Register DIVIDEND; layout independently matched to pinned CMSIS header and SVD; consult reference manual for value semantics. In divide mode DIVISOR write starts computation after DIVIDEND; in square-root mode DIVIDEND write starts it and DIVISOR is unused. Writes while BUSY are ignored; only 32-bit register accesses are supported. Source: RM1.4 11.5; 11.7.2-3; SDK EAU_StartOperation'
  fields:
  - name: DIVIDEND
    bit_offset: 0
    bit_size: 32
    access: rw
    kind: raw
    description: Field DIVIDEND; raw encoding retained unless explicitly audited.
  write_behavior: command
  read_behavior: ordinary
