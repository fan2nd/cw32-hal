  description: CR0 AHB prescaler mask.
- name: CR1_HSIEN
  value: 1
  description: CR1 internal high-speed oscillator enable.
- name: CR2_SWDIO
  value: 2
  description: CR2 SWD disable bit; setting this makes SWD pins available as GPIO.
- name: CR2_FLASHWAIT_MASK
  value: 112
  description: CR2 Flash wait-state mask.
- name: HSI_TRIM_MASK
  value: 2047
  description: HSI oscillator calibration field, bits 10 through 0.
- name: HSI_DIV_MASK
  value: 30720
  description: HSI oscillator divider field, bits 14 through 11.
- name: HSI_DIV_SHIFT
  value: 11
  description: Least significant bit of the HSI divider field.
- name: HSI_DIV24
  value: 28672
  description: Divider encoding 14 shifted to bit 11 selects HSI /24, nominally 4 MHz.
- name: HSI_STABLE
  value: 32768
  description: HSI oscillator stable flag.
- name: LSI_TRIM_MASK
  value: 511
  description: LSI oscillator calibration field, bits 8 through 0.
