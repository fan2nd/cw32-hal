    description: Raw GPIOF registers describe PF3, but datasheet Rev 1.9 classifies PF03/BOOT as dedicated BOOT. The family mask is register capability only; CW32F030C8 die pins exclude PF3 and safe HAL must not expose it as GPIO.
    source: CW32F030 DS Rev 1.9 Table 3-1 versus RM Rev 2.5 GPIO AF table and SDK GPIOF struct
