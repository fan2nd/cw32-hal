# Optional source-model corrections. The audited subset needs no pending fixes.
# Rules execute in sorted filename order BEFORE perimap kind normalization, and
# before schema validation. Two rules cannot write the same target property.
# Target names are exact, and every referenced block/register/field must exist.
# These comments are syntax documentation, not claims about actual CW32 hardware.
#
# - target: {chip: example_chip, block: vendor_serial, version: v0, register: CTRL}
#   patch: {type: register, offset: 4, access: rw, description: "Corrected text"}
#   provenance: {source: "Exact erratum or SDK reference", reason: "Why it is wrong"}
# - target: {chip: example_chip, block: vendor_serial, version: v0, register: CTRL, field: MODE}
#   patch: {type: field, bit_offset: 4, bit_size: 2, access: rw}
#   provenance: {source: "Exact erratum or SDK reference", reason: "Why it is wrong"}
#
# Register patches support offset/access/description/alias_of/write_behavior/
# read_behavior; field patches support
# bit_offset/bit_size/access/description. Omitted properties remain unchanged.
# Empty patches and unknown keys are errors. Add new hardware in source YAML.
