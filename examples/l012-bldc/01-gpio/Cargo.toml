[package]
name = "cw32-bldc-01-gpio"
version = "0.12.0"
edition = "2021"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
description = "Only GPIO: L012 LED and key"

[dependencies]
embassy-cw32 = { path = "../../../embassy-cw32", default-features = false, features = ["rt", "cw32l012c8", "memory-x"] }
cortex-m = { version = "=0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "=0.7.5" }
embedded-hal = { version = "=1.0.0" }

[[bin]]
name = "bldc_01_gpio"
path = "src/main.rs"
