[package]
name = "cw32-bldc-06-application"
version = "0.24.0"
edition = "2021"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
description = "Embassy application composing the L012 motor controller and bounded I/O task"

[dependencies]
defmt = { version = "=1.0.1" }
defmt-rtt = { version = "=1.0.0", features = ["disable-blocking-mode"] }

embassy-cw32 = { path = "../../../embassy-cw32", default-features = false, features = ["rt", "cw32l012c8", "memory-x"] }
cortex-m = { version = "=0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "=0.7.5" }
critical-section = { version = "=1.2.0" }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-interrupt", "executor-thread"] }

[[bin]]
name = "bldc_06_application"
path = "src/main.rs"
