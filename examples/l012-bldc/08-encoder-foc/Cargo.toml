[package]
name = "cw32-bldc-08-encoder-foc"
default-run = "bldc_08_encoder_foc"
version = "0.24.0"
edition = "2021"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
description = "AB quadrature encoder FOC without index for the L012 BLDC board"

[dependencies]
defmt = { version = "=1.0.1" }
defmt-rtt = { version = "=1.0.0", features = ["disable-blocking-mode"] }

embassy-cw32 = { path = "../../../embassy-cw32", default-features = false, features = ["rt", "cw32l012c8", "memory-x", "unstable-pac"] }
cortex-m = { version = "=0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "=0.7.5" }
critical-section = { version = "=1.2.0" }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"] }

[[bin]]
name = "bldc_08_encoder_foc"
path = "src/main.rs"

[[bin]]
name = "bldc_08_encoder_check"
path = "src/encoder_check.rs"
