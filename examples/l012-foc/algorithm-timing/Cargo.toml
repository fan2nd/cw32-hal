[package]
name = "cw32-l012-foc-algorithm-timing"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["cw32l012c8t6"]
cw32l012c8t6 = ["embassy-cw32/cw32l012c8t6", "cw32-metapac/cw32l012c8t6"]
cw32l012c8u6 = ["embassy-cw32/cw32l012c8u6", "cw32-metapac/cw32l012c8u6"]

[dependencies]
cw32-l012-foc-algorithms = { path = "../foc-algorithms", default-features = false }
embassy-cw32 = { path = "../../../embassy-cw32", default-features = false, features = ["rt", "defmt"] }
cw32-metapac = { path = "../../../cw32-metapac", default-features = false }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1"
defmt-rtt = { version = "1", features = ["disable-blocking-mode"] }

[build-dependencies]
cw32-metapac = { path = "../../../cw32-metapac", default-features = false, features = ["metadata"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = 2
