[package]
name = "cw32-l012-foc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["cw32l012c8t6"]
cw32l012c8t6 = ["embassy-cw32/cw32l012c8t6", "embassy-cw32/defmt", "cw32-metapac/cw32l012c8t6"]
cw32l012c8u6 = ["embassy-cw32/cw32l012c8u6", "embassy-cw32/defmt", "cw32-metapac/cw32l012c8u6"]

[dependencies]
embassy-cw32 = { path = "../../embassy-cw32", default-features = false, features = ["rt"] }
cw32-metapac = { path = "../../cw32-metapac", default-features = false }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embedded-hal = "1.0"
defmt = "1"
defmt-rtt = { version = "1", features = ["disable-blocking-mode"] }

[build-dependencies]
cw32-metapac = { path = "../../cw32-metapac", default-features = false, features = ["metadata"] }

[profile.dev]
opt-level = "s"
debug = 0

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = 2
