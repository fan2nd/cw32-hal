[package]
name = "cw32-mco-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
autobins = false

[workspace]

[features]
default = ["cw32f030c8t7"]
defmt = ["embassy-cw32/defmt"]
cw32f030c8t7 = ["embassy-cw32/cw32f030c8t7", "cw32-metapac/cw32f030c8t7"]
cw32f030k8t7 = ["embassy-cw32/cw32f030k8t7", "cw32-metapac/cw32f030k8t7"]
cw32f030k8u7 = ["embassy-cw32/cw32f030k8u7", "cw32-metapac/cw32f030k8u7"]
cw32a030c8t7 = ["embassy-cw32/cw32a030c8t7", "cw32-metapac/cw32a030c8t7"]

[dependencies]
embassy-cw32 = { path = "../../../embassy-cw32", default-features = false, features = ["rt"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

[build-dependencies]
cw32-metapac = { path = "../../../cw32-metapac", default-features = false, features = ["metadata"] }

[[bin]]
name = "hclk"
path = "src/bin/hclk.rs"

[[bin]]
name = "pclk"
path = "src/bin/pclk.rs"

[profile.dev]
opt-level = "s"
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 0
incremental = false
