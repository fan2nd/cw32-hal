  source: 'CW32x030 RM Rev 2.5 22.13.2; 22.13.10'
  description: 'Reading consumes the unread-result state used by overrun detection and DISCARD result retention. This does not automatically clear EOC, EOS or OVW; clear interrupt flags explicitly through ICR.'
- block: adc
