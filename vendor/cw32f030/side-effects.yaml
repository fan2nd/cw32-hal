- block: sysctrl
  register: RESETFLAG
  write_behavior: zero_to_clear
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 4.7.18"
  description: "Reset-cause flags are RW0: reads report actual causes; zero clears and one preserves."

- block: sysctrl
  register: CR0
  write_behavior: keyed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 4.7.1"
  description: "Every write requires KEY[31:16]=0x5A5A. KEY is write-only; do not use an unkeyed read-modify-write. This does not impose a key on other registers."

- block: sysctrl
  register: CR1
  write_behavior: keyed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 4.7.2"
  description: "Every write requires KEY[31:16]=0x5A5A. KEY is write-only. LSELOCK can make LSEEN set-only; LSEEN is reset only by power-on reset. CLKCCS, HSECCS and LSECCS must remain one per this manual revision. This does not impose a key on other registers."

- block: sysctrl
  register: CR2
  write_behavior: keyed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 4.7.3"
  description: "Every write requires KEY[31:16]=0x5A5A. KEY is write-only; do not use an unkeyed read-modify-write. This does not impose a key on other registers."

