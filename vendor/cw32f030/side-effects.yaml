# Independent CW32x030 User Manual Rev 2.5 review. No L012 overlay is applied.
# Conditional/mixed semantics are conservative register-level classifications.

- block: adc
  register: ICR
  write_behavior: zero_to_clear
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 22.13.11; 1.2"
  description: "Implemented R1W0 fields read as one; writing zero clears the associated flag and writing one preserves it. Keep unselected implemented bits at one; reserved-bit policy remains register-specific."

