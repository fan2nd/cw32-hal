  write_behavior: keyed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 12.3.4-5; 12.5.1-9; 12.5.12-13"
  description: "RTC writes require prior KEY unlock. Calendar-related access additionally requires CR1.ACCESS and the WINDOW handshake; finish within one second and clear ACCESS to avoid timekeeping error."

- block: rtc
  register: IER
  write_behavior: keyed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 12.3.4-5; 12.5.1-9; 12.5.12-13"
  description: "RTC writes require prior KEY unlock. Calendar-related access additionally requires CR1.ACCESS and the WINDOW handshake; finish within one second and clear ACCESS to avoid timekeeping error."

- block: iwdt
  register: KR
  write_behavior: command
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 16.6.1"
  description: "0x5555 unlocks protected registers; another value locks them. 0xCCCC starts, 0xAAAA reloads, and 0x5A5A then 0xA5A5 stops. Commands also close write access."

- block: iwdt
  register: CR
  write_behavior: keyed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 16.3.4; 16.6.2-6"
  description: "Requires KR=0x5555 and the matching update flag cleared before writing. Poll completion across the watchdog clock domain. WINR update reloads the counter; a window violation may reset the chip."

- block: iwdt
  register: ARR
  write_behavior: keyed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 16.3.4; 16.6.2-6"
  description: "Requires KR=0x5555 and the matching update flag cleared before writing. Poll completion across the watchdog clock domain. WINR update reloads the counter; a window violation may reset the chip."

- block: iwdt
  register: WINR
  write_behavior: keyed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 16.3.4; 16.6.2-6"
  description: "Requires KR=0x5555 and the matching update flag cleared before writing. Poll completion across the watchdog clock domain. WINR update reloads the counter; a window violation may reset the chip."

- block: iwdt
  register: SR
  write_behavior: zero_to_clear
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 16.6.6"
  description: "OV bit 3 is RW0; RUN, RELOAD and update flags are read-only."

- block: wwdt
  register: CR0
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 17.6.1"
  description: "EN is RW1 and cannot be disabled after enabling. WCNT reads the current count and writes refresh it; refresh outside the window may reset the chip."

- block: wwdt
  register: CR1
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 17.6.2"
  description: "IE cannot be cleared once set, although labelled RW. PRS and WINR are ordinary configuration."

- block: wwdt
  register: SR
  write_behavior: zero_to_clear
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 17.6.3"
  description: "POV reports pre-overflow; writing zero clears it."

- block: adc
  register: RESULT0
  write_behavior: ordinary
  read_behavior: latch
  source: 'CW32x030 RM Rev 2.5 22.13.2; 22.13.10; 22.5.1'
  description: 'Reading consumes the unread-result state used by overrun detection and DISCARD result retention. The latch classification records this state change; it does not mean the value is a FIFO or that reading clears EOC, EOS or OVW. Clear interrupt flags explicitly through ICR.'
- block: adc
  register: RESULT1
  write_behavior: ordinary
  read_behavior: latch
  source: 'CW32x030 RM Rev 2.5 22.13.2; 22.13.10'
  description: 'Reading consumes the unread-result state used by overrun detection and DISCARD result retention. This does not automatically clear EOC, EOS or OVW; clear interrupt flags explicitly through ICR.'
- block: adc
  register: RESULT2
  write_behavior: ordinary
