- block: gpio
  register: BRR
  write_behavior: one_to_clear
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 9.6.20"
  description: "Writing a one clears the corresponding ODR pin. Reads return zero; zero writes do nothing."

- block: gpio
  register: BSRR
  write_behavior: command
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 9.6.21"
  description: "Writing one in bits 15:0 sets the corresponding ODR pin; writing one in bits 31:16 clears it. Set takes priority when both are selected. Reads return zero."

- block: gpio
  register: TOG
  write_behavior: toggle
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 9.6.22"
  description: "Writing a one toggles the corresponding ODR pin; zero has no effect and reads return zero."

- block: adc
  register: START
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 22.4.1; 22.13.8"
  description: "START=1 starts conversion and START=0 stops it; hardware clears START when the selected mode completes. AUTOSTOP is configuration and can disable ADC at completion."

- block: adc
  register: CR2
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 22.13.3"
  description: "ACCRST is R0W1: writing one clears the RESULTACC accumulation register, while zero has no effect. ACCEN and CNT are ordinary configuration."

- block: atim
  register: CR
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 15.7.1"
  description: "BG, UG and TG are self-clearing software commands. UG also initializes the counter, loads enabled shadows and resets the prescaler. DIR is writable only in edge-aligned mode; other bits configure counting and interrupts."

- block: atim
  register: CH1CR
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 15.7.11-13"
  description: "CCGA and CCGB are self-clearing software capture/compare triggers; other bits configure capture/compare and DMA."

- block: atim
  register: CH2CR
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 15.7.11-13"
  description: "CCGA and CCGB are self-clearing software capture/compare triggers; other bits configure capture/compare and DMA."

- block: atim
  register: CH3CR
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 15.7.11-13"
  description: "CCGA and CCGB are self-clearing software capture/compare triggers; other bits configure capture/compare and DMA."

- block: crc
  register: CR
  write_behavior: command
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 10.4; 10.6.1"
  description: "Selecting the CRC algorithm initializes the calculation state; it is not an ordinary software-owned latch."

- block: crc
  register: DR8
  write_behavior: command
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 10.3; 10.6.2"
  description: "Writing feeds one datum into the CRC engine. The actual bus access width selects 8, 16 or 32 input bits; aliases must retain their access width."

- block: crc
  register: DR16
  write_behavior: command
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 10.3; 10.6.2"
  description: "Writing feeds one datum into the CRC engine. The actual bus access width selects 8, 16 or 32 input bits; aliases must retain their access width."

- block: crc
  register: DR32
  write_behavior: command
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 10.3; 10.6.2"
  description: "Writing feeds one datum into the CRC engine. The actual bus access width selects 8, 16 or 32 input bits; aliases must retain their access width."

- block: dma
  register: TRIG1
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 8.8.4"
  description: "SOFTSRC: one starts a transfer; zero has no function. Reads report active transfer and hardware clears it on completion. TYPE and HARDSRC are configuration."

- block: dma
  register: TRIG2
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 8.8.4"
  description: "SOFTSRC: one starts a transfer; zero has no function. Reads report active transfer and hardware clears it on completion. TYPE and HARDSRC are configuration."

- block: dma
  register: TRIG3
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 8.8.4"
  description: "SOFTSRC: one starts a transfer; zero has no function. Reads report active transfer and hardware clears it on completion. TYPE and HARDSRC are configuration."

- block: dma
  register: TRIG4
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 8.8.4"
  description: "SOFTSRC: one starts a transfer; zero has no function. Reads report active transfer and hardware clears it on completion. TYPE and HARDSRC are configuration."

- block: dma
  register: TRIG5
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 8.8.4"
  description: "SOFTSRC: one starts a transfer; zero has no function. Reads report active transfer and hardware clears it on completion. TYPE and HARDSRC are configuration."

- block: dmachannel
  register: TRIG
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 8.8.4"
  description: "SOFTSRC: one starts a transfer; zero has no function. Reads report active transfer and hardware clears it on completion. TYPE and HARDSRC are configuration."

- block: i2c
  register: CR
  write_behavior: mixed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 20.7.3"
  description: "STA requests START and must be cleared by software. STO requests STOP and self-clears. SI is zero-to-clear and clearing it advances the bus state machine. Preserve configuration and status intentionally."

- block: i2c
  register: DR
  write_behavior: command
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 20.7.4"
  description: "Writes prepare the next transmit byte and reads obtain the received byte. SI clearing separately advances the transfer; this is not the L012 FIFO controller."

- block: spi
  register: ICR
  write_behavior: zero_to_clear
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 19.8.6"
  description: "R1W0 interrupt clears plus FLUSH bit zero: writing zero to FLUSH clears the transmit buffer and shift register and sets TXE. Unselected bits must remain one to avoid an unintended flush."

- block: spi
  register: DR
  write_behavior: command
  read_behavior: clear
  source: "CW32x030 RM Rev 2.5 19.6.1; 19.8.7"
  description: "A write queues transmit data and clears TXE. Reading receives buffered data and clears RXNE; a generic read-modify-write is invalid."

- block: uart
  register: TDR
  write_behavior: command
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 18.5; 18.9.5-6"
  description: "Writing queues a transmit frame and clears TXE. RDR does not automatically clear RC; software clears RC separately through ICR."

- block: vc
  register: SR
  write_behavior: zero_to_clear
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 23.7.4"
  description: "INTF is cleared by writing zero; READY and FLTV are read-only status. Preserve the clearable flag when no clear is intended."

- block: lvd
  register: SR
  write_behavior: zero_to_clear
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 24.7.3"
  description: "INTF is cleared by writing zero; FLTV is read-only status."

- block: rtc
  register: KEY
  write_behavior: command
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 12.5.1"
  description: "Write 0xCA then 0x53 to unlock RTC writes. Write 0xCA then another value to lock all registers except KEY and ICR."

- block: rtc
  register: CR0
  write_behavior: keyed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 12.3.4-5; 12.5.1-9; 12.5.12-13"
  description: "RTC writes require prior KEY unlock. Calendar-related access additionally requires CR1.ACCESS and the WINDOW handshake; finish within one second and clear ACCESS to avoid timekeeping error."

- block: rtc
  register: CR1
  write_behavior: keyed
  read_behavior: ordinary
  source: "CW32x030 RM Rev 2.5 12.3.4-5; 12.5.1-9; 12.5.12-13"
  description: "RTC writes require prior KEY unlock. Calendar-related access additionally requires CR1.ACCESS and the WINDOW handshake; finish within one second and clear ACCESS to avoid timekeeping error."

- block: rtc
  register: CR2
  write_behavior: keyed
  read_behavior: ordinary
